name: Build and regression tests

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore NimbusLedger.sln
      - name: Build
        run: dotnet build NimbusLedger.sln -c Release --no-restore --nologo
      - name: Test
        run: dotnet test NimbusLedger.Tests/NimbusLedger.Tests.csproj -c Release --no-build --no-restore --nologo
      - name: Audit dependencies
        shell: pwsh
        run: |
          $result = dotnet list NimbusLedger.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed." }
          $vulnerabilities = @($result.projects.frameworks | ForEach-Object {
            $_.topLevelPackages
            $_.transitivePackages
          } | Where-Object { $null -ne $_ })
          if ($vulnerabilities.Count) {
            throw "Vulnerable dependencies detected."
          }
